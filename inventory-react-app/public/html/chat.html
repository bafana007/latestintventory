{{pageHead}}
<div class="chat-layout">
  <div class="chat-senders">
    <h2>People who sent messages</h2>
    <div class="sender-list" data-insert="chat-senders"></div>
  </div>
  <div class="chat-wrap">
    <div id="chat-active-name" class="chat-active-name">Select a conversation</div>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form" data-action="chat-send">
      <input name="text" placeholder="Type a message..." required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</div>
