{{pageHead}}
<div class="card">
  <div class="page-head">
    <h2>Add New Product</h2>
    <button type="button" class="btn ghost small" id="toggle-create-form">Add Product</button>
  </div>
  <form data-action="create-product" id="create-product-form">
    <div class="field-row">
      <div class="field"><label>SKU</label><input name="sku" required></div>
      <div class="field"><label>Name</label><input name="name" required></div>
      <div class="field"><label>Category</label><select name="categoryId">{{categoryOptions}}</select></div>
      <div class="field"><label>Location</label><input name="location" placeholder="Aisle / shelf"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Opening qty</label><input name="quantity" type="number" value="0" min="0"></div>
      <div class="field"><label>Reorder level</label><input name="reorderLevel" type="number" value="5" min="0"></div>
      <div class="field"><label>Unit price</label><input name="unitPrice" type="number" step="0.01" value="0"></div>
      <div class="field"><label>Description</label><input name="description"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Image</label><input type="file" name="image" accept="image/*" class="product-image-input"></div>
    </div>
    <button type="submit">Create product</button>
  </form>
</div>
<div class="card mt-20">
  <div data-insert="products-table"></div>
</div>
